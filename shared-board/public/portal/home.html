<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#11120f">
    <meta name="description" content="选择并进入 QE 给圆圆宝宝准备的网站功能。">
    <title>功能中心 | QE 给圆圆宝宝</title>
    <link rel="stylesheet" href="/portal/home.css?v=20260829-portal2">
    <script type="module" src="/portal/home.js?v=20260829-portal2"></script>
  </head>
  <body>
    <a class="skip-link" href="#featureGrid">跳到功能列表</a>

    <header class="site-header">
      <a class="site-brand" href="/home" aria-label="返回功能中心">
        <span class="brand-mark" aria-hidden="true">Q</span>
        <span class="brand-copy">
          <strong>QE 给圆圆宝宝</strong>
          <span>MYUAN.XIN</span>
        </span>
      </a>
      <span class="current-section" aria-current="page">功能中心</span>
    </header>

    <main class="portal-main">
      <section class="portal-intro" aria-labelledby="portalTitle">
        <p class="eyebrow">SPACES</p>
        <h1 id="portalTitle">选择一个功能</h1>
        <p>这里收纳我们的网站空间。选一个入口，去想去的地方。</p>
      </section>

      <nav class="feature-navigation" aria-label="网站功能">
        <ul class="feature-grid" id="featureGrid">
          <li class="feature-item" data-feature-id="star-bottle">
            <a class="feature-card" href="/star-bottle">
              <span class="feature-art feature-art-star-bottle" aria-hidden="true">
                <span class="feature-art-stars"></span>
                <span class="feature-art-bottle"><i></i><i></i><i></i><i></i><i></i></span>
              </span>
              <span class="feature-content">
                <span class="feature-heading">
                  <span class="feature-icon" aria-hidden="true">✦</span>
                  <strong>星星瓶</strong>
                </span>
                <span class="feature-description">从星河里挑一颗星星，打开一张给圆圆宝宝的纸条。</span>
                <span class="feature-action">进入星星瓶 <span aria-hidden="true">→</span></span>
              </span>
            </a>
          </li>
          <li class="feature-item" data-feature-id="love-stars">
            <a class="feature-card" href="/love-stars">
              <span class="feature-art feature-art-love-stars" aria-hidden="true">
                <span class="feature-art-dust"></span>
                <span class="feature-art-binary"><i></i><i></i></span>
              </span>
              <span class="feature-content">
                <span class="feature-heading">
                  <span class="feature-icon" aria-hidden="true">☆</span>
                  <strong>七夕星空情书</strong>
                </span>
                <span class="feature-description">旋转视角，在星尘与双星之间发现一封隐藏的告白。</span>
                <span class="feature-action">进入 <span aria-hidden="true">→</span></span>
              </span>
            </a>
          </li>
          <li class="feature-item" data-feature-id="wrong">
            <a class="feature-card" href="/wrong">
              <span class="feature-art feature-art-wrong" aria-hidden="true">
                <img class="feature-art-bear" src="/wrong/assets/white-bear.png" alt="" loading="lazy">
                <img class="feature-art-hammer" src="/wrong/assets/red-hammer.png" alt="" loading="lazy">
              </span>
              <span class="feature-content">
                <span class="feature-heading">
                  <span class="feature-icon" aria-hidden="true">✧</span>
                  <strong>严格教育现场</strong>
                </span>
                <span class="feature-description">点击舞台，看圆圆宝宝拿小锤子敲打 QE。</span>
                <span class="feature-action">进入 <span aria-hidden="true">→</span></span>
              </span>
            </a>
          </li>
        </ul>
      </nav>

      <p class="portal-status" id="portalStatus" role="status" aria-live="polite">正在同步功能列表</p>
      <noscript><p class="portal-notice">当前浏览器未启用 JavaScript，仍可进入上方已有功能。</p></noscript>
    </main>

    <footer class="site-footer">
      <span>给圆圆宝宝的小网站</span>
      <span aria-hidden="true">·</span>
      <span id="featureCount">3 个可用功能</span>
    </footer>
  </body>
</html>
