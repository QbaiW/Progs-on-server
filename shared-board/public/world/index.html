<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星空世界</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: #05060f radial-gradient(ellipse at 50% 0%, #1b2350 0%, #05060f 70%);
    color: #e8ecff;
    font: 16px/1.7 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px;
    overflow: hidden;
  }
  /* 星尘层：纯 CSS，不引入图片 */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 78% 14%, #cfe0ff, transparent),
      radial-gradient(2px 2px at 34% 68%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 63% 82%, #ffd9f0, transparent),
      radial-gradient(1.5px 1.5px at 88% 55%, #fff, transparent),
      radial-gradient(1px 1px at 22% 88%, #cfe0ff, transparent),
      radial-gradient(1px 1px at 52% 38%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 7% 60%, #fff, transparent);
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .55 } to { opacity: 1 } }

  main {
    position: relative; z-index: 1;
    max-width: 460px; text-align: center; padding: 40px 32px;
    border: 1px solid rgba(150,180,255,.22); border-radius: 20px;
    background: rgba(12,16,40,.55); backdrop-filter: blur(8px);
  }
  .icon { font-size: 40px; line-height: 1; }
  h1 { margin: 18px 0 10px; font-size: 26px; letter-spacing: .06em; font-weight: 600; }
  p { margin: 0 0 28px; color: #9fb0e0; font-size: 14px; }
  a.enter {
    display: inline-block; padding: 13px 34px; border-radius: 999px;
    background: linear-gradient(135deg, #6f8cff, #a77bff);
    color: #fff; text-decoration: none; font-weight: 600; letter-spacing: .08em;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  a.enter:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(120,140,255,.4); }
  .hint { margin-top: 22px; font-size: 12px; color: #6d7bad; }
</style>
</head>
<body>
<main>
  <div class="icon">✵</div>
  <h1>星空世界</h1>
  <p>点进去就能玩的 3D 联机世界。<br>朋友们可以一起走动、聊天、放模型。</p>
  <a class="enter" href="https://world.myiuan.xin">进入世界</a>
  <div class="hint">建议用电脑打开，支持 WASD 移动</div>
</main>
</body>
</html>
