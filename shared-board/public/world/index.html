<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星空世界</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body {
    min-height: 100vh; margin: 0;
    display: grid; place-items: center;
    background: #05060f radial-gradient(ellipse at 50% 0%, #1b2350 0%, #05060f 70%);
    color: #e8ecff;
    font: 16px/1.7 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px;
  }
  /* 星尘层：纯 CSS，不引入图片 */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 78% 14%, #cfe0ff, transparent),
      radial-gradient(2px 2px at 34% 68%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 63% 82%, #ffd9f0, transparent),
      radial-gradient(1.5px 1.5px at 88% 55%, #fff, transparent),
      radial-gradient(1px 1px at 22% 88%, #cfe0ff, transparent),
      radial-gradient(1px 1px at 52% 38%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 7% 60%, #fff, transparent);
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .55 } to { opacity: 1 } }

  main {
    position: relative; z-index: 1; width: 100%; max-width: 700px;
    text-align: center; padding: 38px 32px 30px;
    border: 1px solid rgba(150,180,255,.22); border-radius: 20px;
    background: rgba(12,16,40,.55); backdrop-filter: blur(8px);
  }
  .icon { font-size: 40px; line-height: 1; }
  h1 { margin: 18px 0 10px; font-size: 26px; letter-spacing: .06em; font-weight: 600; }
  main > p { margin: 0 0 26px; color: #9fb0e0; font-size: 14px; }

  .worlds { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; text-align: center; }
  @media (max-width: 560px) { .worlds { grid-template-columns: 1fr; } }

  .world {
    padding: 22px 18px 20px; border-radius: 16px;
    border: 1px solid rgba(150,180,255,.18);
    background: rgba(255,255,255,.03);
    transition: border-color .18s ease, transform .18s ease;
  }
  .world:hover { border-color: rgba(150,180,255,.5); transform: translateY(-2px); }
  .world .wicon { font-size: 30px; line-height: 1; color: #cfe0ff; }
  .world h2 { margin: 12px 0 6px; font-size: 18px; font-weight: 600; letter-spacing: .05em; }
  .world .wdesc { min-height: 2.9em; margin-bottom: 16px; font-size: 13px; line-height: 1.45; color: #93a3d4; }

  a.enter {
    display: inline-block; padding: 11px 30px; border-radius: 999px;
    background: linear-gradient(135deg, #6f8cff, #a77bff);
    color: #fff; text-decoration: none; font-weight: 600; font-size: 15px; letter-spacing: .08em;
    transition: box-shadow .18s ease;
  }
  a.enter:hover { box-shadow: 0 10px 30px rgba(120,140,255,.4); }

  a.skin {
    display: block; margin: 20px auto 0; max-width: 200px;
    padding: 10px 0; border-radius: 999px; text-align: center;
    border: 1px solid rgba(150,180,255,.3); color: #b9c6f5;
    text-decoration: none; font-size: 14px; letter-spacing: .05em;
    transition: border-color .18s ease, color .18s ease;
  }
  a.skin:hover { border-color: rgba(150,180,255,.7); color: #fff; }

  .hint { margin-top: 20px; font-size: 12px; color: #6d7bad; }
  .hint a { color: #8fa2d8; text-decoration: none; border-bottom: 1px dotted rgba(150,180,255,.4); }
  .hint a:hover { color: #cfe0ff; }
</style>
</head>
<body>
<main>
  <div class="icon">✵</div>
  <h1>星空世界</h1>
  <p>点进去就能玩的 3D 联机世界。<br>朋友们可以一起走动、聊天、放模型。</p>

  <div class="worlds">
    <section class="world">
      <div class="wicon">🌲</div>
      <h2>森林小屋</h2>
      <div class="wdesc">松林环绕的山顶小屋<br>屋旁一堆篝火</div>
      <a class="enter" href="https://world.myiuan.xin">进入</a>
    </section>

    <section class="world">
      <div class="wicon">⌂</div>
      <h2>雪顶小屋</h2>
      <div class="wdesc">雪顶小岛上的两层小屋<br>还有一艘能开的小船</div>
      <a class="enter" href="https://world2.myiuan.xin">进入</a>
    </section>
  </div>

  <a class="skin" href="/skin/index.html">✧ 挑一张皮肤</a>
  <div class="hint">建议用电脑打开，支持 WASD 移动<br>
    只想进去玩，点上面对应世界的「进入」即可，不需要任何密码<br>
    <a href="/worlds/">世界管理台</a>（开关世界用，用你这个站点的登录态，不再另外要密码）</div>
</main>
</body>
</html>
